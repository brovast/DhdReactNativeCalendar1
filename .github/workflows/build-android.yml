name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允许你手动点击按钮触发构建

jobs:
  build:
    runs-on: ubuntu-latest # 使用免费的 Linux 运行器

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'        # 关键步骤：强制使用 JDK 17
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'              # 根据你的项目实际情况，也可能是 'yarn'

      - name: Install dependencies
        run: npm install            # 或 yarn install

      - name: Build with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease # 这会生成一个可安装的 APK

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
